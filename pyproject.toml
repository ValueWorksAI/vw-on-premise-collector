[tool.poetry]
name = "vw-on-prem-collector"
version = "0.1.0"
description = "Generic on-premise data collector framework. Each data source is a self-contained 'push' under sources/. The orchestrator runs them sequentially or in parallel and uploads results to Azure Blob Storage."
authors = ["ValueWorks"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
requests = "^2.31"
pandas = "^2.2"
# Wide range: old pythons resolve pyarrow 16.x, Python 3.13/3.14 need >=18/>=25.
pyarrow = ">=16.0,<26"
pyyaml = "^6.0"
python-dotenv = "^1.0"

# Only needed for MSSQL sources: poetry install --with mssql
# pymssql is self-contained (bundles FreeTDS); pyodbc additionally requires
# the Microsoft ODBC driver (msodbcsql18) on the host.
[tool.poetry.group.mssql]
optional = true

[tool.poetry.group.mssql.dependencies]
pymssql = "^2.3"
pyodbc = "^5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

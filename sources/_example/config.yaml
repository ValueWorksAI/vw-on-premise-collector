# Template for a new source. Copy this folder to sources/<your-source>/ and edit.
name: example
output_dir: C:\output\example
max_workers: 5

# Delete each object's parquet from output_dir as soon as it lands in Azure (default).
# Set true to keep the newest one per object for inspection on the machine itself;
# that costs a full second copy of the dataset on disk and nothing reads it back.
keep_local_copy: false

azure:
  storage_url: ${env:AZURE_STORAGE_URL}
  sas_token:   ${env:AZURE_STORAGE_SAS_TOKEN}
  container:   warehouse
  prefix:      raw/example

# Optional: partition keys (e.g. company IDs, tenant IDs) iterated per object.
# Leave empty for single-shot fetches.
partition_field: companyId
partitions: []

# Connection block is free-form; your push.py parses it.
connection:
  base_url: https://example.local/api
  username: ${env:EXAMPLE_USERNAME}
  password: ${env:EXAMPLE_PASSWORD}
  verify_ssl: false

objects:
  - name: SomeObject
    endpoint: v1/SomeObject
    timestamp_field: lastChange   # null => always full refresh
    partition_scoped: true
